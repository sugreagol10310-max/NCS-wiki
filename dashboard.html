<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCS Wiki – Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#171c25;--text:#eef2f7;--muted:#9ba6b5;--line:#29313d;--accent:#7dd3fc;--accent2:#a78bfa;--danger:#fb7185;--radius:18px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080a0f,#0c1017);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}header{padding:28px 24px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(9,11,16,.92);backdrop-filter:blur(14px);z-index:10}.header-inner{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}button,select,input{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:11px;cursor:pointer}button:hover{border-color:#536071}main{max-width:1250px;margin:0 auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:18px}.metric-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.metric{font-size:30px;font-weight:800;margin-top:7px}section{margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}h2{font-size:20px;margin:0}.hint{font-size:12px;color:var(--muted)}.rank-table{width:100%;border-collapse:collapse}.rank-table th,.rank-table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}.rank-table th{font-size:12px;color:var(--muted);font-weight:600}.rank-table td{font-size:14px}.rank{font-weight:800;width:55px}.plays{font-variant-numeric:tabular-nums;text-align:right!important}.pref{color:var(--accent2);font-weight:700}.song-link{text-decoration:none}.song-link:hover{text-decoration:underline}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.controls label{font-size:13px;color:var(--muted)}input[type=range]{width:min(600px,70vw)}.race-wrap{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#0b0e14;padding:12px}.race-stage{position:relative;height:620px;min-height:500px}.bar{position:absolute;left:0;height:34px;display:flex;align-items:center;transition:top .45s ease,width .45s ease,opacity .3s ease;gap:8px}.bar-rank{width:28px;text-align:right;color:var(--muted);font-size:12px}.bar-label{width:245px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.bar-track{height:24px;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--accent2));min-width:2px}.bar-value{width:85px;text-align:right;font-variant-numeric:tabular-nums;font-weight:750;font-size:13px}.race-status{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}.error{color:var(--danger);background:#2a1118;border:1px solid #57202c;padding:12px;border-radius:12px;white-space:pre-wrap}.loading{color:var(--muted);padding:20px 0}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-label{width:180px}}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:1fr 1fr}.metric{font-size:23px}.bar-label{width:120px}.bar-value{width:65px}.race-stage{height:520px}}
</style></head><body>
<header><div class="header-inner"><div><h1>🎵 NCS Wiki Dashboard</h1><div class="sub">NCS Player のデータを使った総合統計・ランキング</div></div><button id="reload">↻ 更新</button></div></header>
<main><div id="message" class="loading">Firebaseからデータを読み込んでいます…</div><div id="app" style="display:none">
<div class="grid"><div class="card"><div class="metric-label">登録曲数</div><div class="metric" id="songCount">—</div></div><div class="card"><div class="metric-label">総再生回数</div><div class="metric" id="totalPlays">—</div></div><div class="card"><div class="metric-label">総視聴時間</div><div class="metric" id="totalTime">—</div></div><div class="card"><div class="metric-label">記録日数</div><div class="metric" id="dayCount">—</div></div></div>
<section><div class="section-title"><h2>🏆 現在の総合ランキング</h2><span class="hint">再生回数順 / 同数は同順位</span></div><div class="card"><table class="rank-table"><thead><tr><th>#</th><th>曲</th><th>好き度</th><th style="text-align:right">再生回数</th></tr></thead><tbody id="ranking"></tbody></table></div></section>
<section><div class="section-title"><h2>📈 Play Count Bar Chart Race</h2><span class="hint">daily_history の実測スナップショットを使用</span></div><div class="card"><div class="controls"><button id="playRace">▶ 再生</button><button id="stopRace">■ 停止</button><label>日付</label><input id="dateSlider" type="range" min="0" max="0" value="0"><span id="dateLabel">—</span><label>表示曲数 <select id="topN"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></label></div><div class="race-wrap"><div class="race-stage" id="raceStage"></div><div class="race-status"><span id="raceInfo">—</span><span>※データが存在する日だけ表示</span></div></div></div></section>
<section><div class="section-title"><h2>⚡ 現在のTop 20</h2><span class="hint">再生回数の多い曲</span></div><div class="card" id="top20Chart"></div></section>
</div></main>
<script>
const DB="https://ncs-music-e2d05-default-rtdb.firebaseio.com";let songs={},history={},dates=[],raceTimer=null,currentDateIndex=0;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),num=n=>Number(n||0).toLocaleString("ja-JP"),formatTime=sec=>{sec=Number(sec||0);let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h.toLocaleString()}h ${m}m`:`${m}m`};
async function get(path){let r=await fetch(DB+path+".json");if(!r.ok)throw Error(`Firebase HTTP ${r.status}: ${path}`);return await r.json()}
function rankList(){return Object.values(songs).filter(Boolean).sort((a,b)=>Number(b.playCount||0)-Number(a.playCount||0)||Number(a.order||0)-Number(b.order||0))}function competitionRanks(list){let last=null,rank=0;return list.map((s,i)=>{let p=Number(s.playCount||0);if(p!==last)rank=i+1;last=p;return rank})}
function renderOverview(){let list=rankList();$("songCount").textContent=num(list.length);$("totalPlays").textContent=num(list.reduce((a,s)=>a+Number(s.playCount||0),0));$("totalTime").textContent=formatTime(list.reduce((a,s)=>a+Number(s.totalWatchTime||0),0));$("dayCount").textContent=num(dates.length);let ranks=competitionRanks(list);$("ranking").innerHTML=list.slice(0,50).map((s,i)=>`<tr><td class="rank">#${ranks[i]}</td><td><a class="song-link" href="./index.html?id=${encodeURIComponent(s.id||"")}">${esc(s.title||"Unknown")}</a></td><td class="pref">#${Number(s.order||0)+1}</td><td class="plays">${num(s.playCount)}</td></tr>`).join("");let top=list.slice(0,20),max=Math.max(1,...top.map(s=>Number(s.playCount||0)));$("top20Chart").innerHTML=top.map((s,i)=>{let w=Math.max(2,Number(s.playCount||0)/max*100);return `<div style="display:grid;grid-template-columns:35px minmax(150px,260px) 1fr 75px;gap:8px;align-items:center;margin:8px 0"><b>#${i+1}</b><span title="${esc(s.title)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.title)}</span><div style="height:18px;background:#202632;border-radius:6px;overflow:hidden"><div style="height:100%;width:${w}%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px"></div></div><b style="text-align:right">${num(s.playCount)}</b></div>`}).join("")}
function buildHistory(raw){let out={};if(!raw)return out;for(let [date,day] of Object.entries(raw)){if(!day||!day.songs)continue;out[date]={};for(let [id,s] of Object.entries(day.songs||{})){if(s&&Number.isFinite(Number(s.playCount)))out[date][id]=Number(s.playCount)}}return out}
function renderRace(){let date=dates[currentDateIndex];if(!date)return;$("dateLabel").textContent=date;let values=history[date]||{},n=Number($("topN").value),rows=Object.entries(values).map(([id,plays])=>({id,plays,s:songs[id]})).filter(x=>x.s).sort((a,b)=>b.plays-a.plays).slice(0,n),max=Math.max(1,...rows.map(x=>x.plays)),stage=$("raceStage");stage.innerHTML="";rows.forEach((x,i)=>{let el=document.createElement("div");el.className="bar";el.style.top=i*36+"px";el.style.width=Math.max(70,Math.min(100,100*x.plays/max))+"%";el.innerHTML=`<span class="bar-rank">#${i+1}</span><span class="bar-label" title="${esc(x.s.title)}">${esc(x.s.title)}</span><span class="bar-track" style="width:${Math.max(2,Math.min(100,100*x.plays/max))}%"></span><span class="bar-value">${num(x.plays)}</span>`;stage.appendChild(el)});$("raceInfo").textContent=`${rows.length}曲 / ${date}`}
function stopRace(){if(raceTimer){clearInterval(raceTimer);raceTimer=null}}function setupRace(){$("dateSlider").max=Math.max(0,dates.length-1);$("dateSlider").value=currentDateIndex;$("dateSlider").oninput=e=>{stopRace();currentDateIndex=Number(e.target.value);renderRace()};$("topN").onchange=renderRace;$("playRace").onclick=()=>{if(raceTimer||dates.length<2)return;raceTimer=setInterval(()=>{currentDateIndex++;if(currentDateIndex>=dates.length){stopRace();return}$("dateSlider").value=currentDateIndex;renderRace()},900)};$("stopRace").onclick=stopRace;renderRace()}
async function load(){stopRace();$("message").className="loading";$("message").textContent="Firebaseからデータを読み込んでいます…";$("app").style.display="none";try{songs=await get("/music_chart/songs")||{};history=buildHistory(await get("/music_chart/daily_history"));dates=Object.keys(history).sort();currentDateIndex=Math.max(0,dates.length-1);renderOverview();setupRace();$("message").style.display="none";$("app").style.display=""}catch(e){$("message").className="error";$("message").textContent="データの読み込みに失敗しました。\n"+e.message}}$("reload").onclick=load;load();
</script></body></html>
